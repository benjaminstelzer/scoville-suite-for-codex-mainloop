name: Runtime helpers
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    name: runtime (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel, ubuntu-latest]
        python: ['3.11', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test the exact packaged runtime helpers
        run: python -B -m unittest discover -s tests -v
      - uses: actions/setup-python@v5
        if: matrix.python == '3.11'
        with:
          python-version: '3.10'
      - name: Test General helpers on their declared minimum Python
        if: matrix.python == '3.11'
        run: >-
          python -B -c "import sys, unittest; sys.path.insert(0, 'tests'); import test_runtime_helpers as t;
          t.INPUT['variants'] = {k: v for k, v in t.INPUT['variants'].items() if k.startswith('general-')};
          names = ['test_exact_inventory_and_every_registered_helper_has_coverage', 'test_plan_valid_invalid_and_selected_context',
          'test_next_ids_reach_manual_creation_without_helper_writes', 'test_start_facts_remain_read_only',
          'test_encoding_warnings_do_not_hide_syntax_errors', 'test_text_preflight_and_complete_unicode_file_consumer',
          'test_retired_reader_flag_cannot_return_source_content',
          'test_command_capture_withheld_publication_and_prestart_errors',
          'test_text_preflight_invalid_and_corrected_cli_without_overwrite', 'test_text_preflight_rejects_path_escape_before_writing'];
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(t.RuntimeHelpers(n) for n in names));
          sys.exit(not result.wasSuccessful())"
